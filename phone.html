<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CapturePro — Phone Camera</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--accent:#00e5ff;--danger:#ef4444;--success:#10b981;--bg:#0a0a0f;--surface:#111118;--border:#2a2a3a;--text:#e2e8f0;--muted:#64748b;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,'Syne',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px;}
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Mono:wght@700&display=swap');

  .logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
  .logo-icon{width:36px;height:36px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#000;}
  .logo-text{font-size:20px;font-weight:800;letter-spacing:-0.5px;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:360px;margin-bottom:16px;}
  .card-title{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:14px;}

  #peer-id-display{font-family:'Space Mono',monospace;font-size:28px;font-weight:700;letter-spacing:6px;color:var(--accent);text-align:center;padding:16px 0;line-height:1;}
  #status-dot{width:10px;height:10px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:8px;transition:background .3s;}
  #status-dot.connected{background:var(--success);box-shadow:0 0 8px var(--success);}
  #status-dot.waiting{background:var(--accent);animation:pulse 1.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  #cam-preview{width:100%;max-width:360px;border-radius:12px;background:#050508;border:1px solid var(--border);aspect-ratio:9/16;object-fit:cover;display:block;margin-bottom:16px;}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:360px;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;margin-bottom:10px;}
  .btn-primary{background:var(--accent);color:#000;}
  .btn-primary:active{transform:scale(.97);}
  .btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--text);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn:disabled{opacity:.35;}

  #facing-btn{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 20px;color:var(--text);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:8px;}

  select{background:#1a1a26;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 14px;font-size:14px;width:100%;max-width:360px;font-family:inherit;outline:none;margin-bottom:10px;}

  .info-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:8px;}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;background:rgba(0,229,255,.1);color:var(--accent);border:1px solid rgba(0,229,255,.2);}
</style>
</head>
<body>

<div class="logo">
  <div class="logo-icon">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-width="1.5"/></svg>
  </div>
  <span class="logo-text">CapturePro</span>
</div>

<div class="card">
  <div class="card-title">📱 Phone Camera</div>
  <div class="info-row">
    <span id="status-dot" class="waiting"></span>
    <span id="status-text">Waiting for PC to connect...</span>
  </div>
  <div id="peer-id-display" id="peer-id">—</div>
  <p style="text-align:center;font-size:11px;color:var(--muted);margin-top:8px;">Show this code or QR to CapturePro on PC</p>
</div>

<video id="cam-preview" autoplay muted playsinline></video>

<select id="quality-sel">
  <option value="hd">HD 720p</option>
  <option value="fullhd" selected>Full HD 1080p</option>
  <option value="4k">4K (if supported)</option>
</select>

<button class="btn btn-primary" id="btn-start-cam">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
  Start Camera
</button>

<button id="facing-btn" onclick="flipCamera()">
  🔄 Flip Camera
</button>

<br><br>

<div style="width:100%;max-width:360px;">
  <div class="card-title">🔗 Or enter PC's Peer ID manually</div>
  <input id="manual-peer-id" placeholder="Enter 6-digit PC code" maxlength="6"
    style="background:#1a1a26;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:12px 14px;font-size:18px;font-family:'Space Mono',monospace;letter-spacing:4px;width:100%;outline:none;text-align:center;margin-bottom:10px;text-transform:uppercase;">
  <button class="btn btn-ghost" id="btn-connect-manual" onclick="connectManual()">Connect to PC</button>
</div>

<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<script>
let peer = null, conn = null, localStream = null, facingMode = 'environment';
let myPeerId = null;

const elStatus = document.getElementById('status-text');
const elDot = document.getElementById('status-dot');
const elPeerId = document.getElementById('peer-id-display');
const elCamPreview = document.getElementById('cam-preview');

function genShortId() {
  return Math.random().toString(36).substr(2,6).toUpperCase();
}

async function initPeer() {
  const shortId = genShortId();
  myPeerId = shortId;

  peer = new Peer('cpro-phone-' + shortId, {
    host: '0.peerjs.com', port: 443, path: '/', secure: true,
    config: { iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:global.stun.twilio.com:3478' }
    ]}
  });

  peer.on('open', id => {
    elPeerId.textContent = shortId;
    setStatus('waiting', 'Waiting for PC — enter code above on PC');
  });

  // PC answers our call with empty stream — we just ignore it
  peer.on('call', call => {
    call.answer(new MediaStream());
  });

  peer.on('error', e => {
    console.error('Phone peer error:', e);
    setStatus('waiting', 'Error — retrying...');
    setTimeout(initPeer, 3000);
  });
}

function setStatus(state, msg) {
  elDot.className = state;
  elStatus.textContent = msg;
}

async function startCamera() {
  const q = document.getElementById('quality-sel').value;
  const constraints = {
    video: {
      facingMode,
      width:  q==='4k'?{ideal:3840}:q==='fullhd'?{ideal:1920}:{ideal:1280},
      height: q==='4k'?{ideal:2160}:q==='fullhd'?{ideal:1080}:{ideal:720},
      frameRate: {ideal:30}
    },
    audio: { echoCancellation:false, noiseSuppression:false }
  };
  try {
    if (localStream) localStream.getTracks().forEach(t=>t.stop());
    localStream = await navigator.mediaDevices.getUserMedia(constraints);
    elCamPreview.srcObject = localStream;
    document.getElementById('btn-start-cam').textContent = '✓ Camera Active';
    document.getElementById('btn-start-cam').style.background = 'var(--success)';
    return true;
  } catch(e) {
    alert('Camera error: ' + e.message);
    return false;
  }
}

function flipCamera() {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  if (localStream) startCamera();
}

function connectToPC(pcCode) {
  if (!peer || !peer.open) {
    peer.on('open', () => connectToPC(pcCode));
    return;
  }
  if (!localStream) { alert('Start camera first'); return; }

  const pcFullId = 'cpro-pc-' + pcCode.toUpperCase();

  // Step 1: open data channel so PC knows we are here
  const dc = peer.connect(pcFullId, {reliable:true});
  conn = dc;
  dc.on('open', () => {
    setStatus('connected', 'Data channel open, sending video...');
    dc.on('data', d => {
      if (d.type === 'flip') flipCamera();
    });
    // Step 2: call PC with our video stream
    const call = peer.call(pcFullId, localStream);
    call.on('stream', ()=>{}); // PC sends empty stream back
    call.on('error', e => { console.warn('call error', e); setStatus('waiting','Stream error'); });
    call.on('close', () => setStatus('waiting','Disconnected from PC'));
    setStatus('connected', 'Streaming to PC ✓');
  });
  dc.on('error', e => { console.warn('dc err', e); setStatus('waiting','Connection failed'); });
  dc.on('close', () => setStatus('waiting','PC disconnected'));
}

function connectManual() {
  const id = document.getElementById('manual-peer-id').value.trim().toUpperCase();
  if (!id || id.length < 4) { alert('Enter the 6-digit PC code'); return; }
  connectToPC(id);
}

document.getElementById('btn-start-cam').onclick = startCamera;

// Init peer
initPeer();

// Auto-connect if ?pc=CODE in URL (from QR scan)
window.addEventListener('load', () => {
  const params = new URLSearchParams(window.location.search);
  const pcCode = params.get('pc');
  if (pcCode) {
    document.getElementById('manual-peer-id').value = pcCode.toUpperCase();
    startCamera().then(ok => {
      if (!ok) return;
      const tryConnect = () => {
        if (peer && peer.open) connectToPC(pcCode);
        else setTimeout(tryConnect, 500);
      };
      setTimeout(tryConnect, 800);
    });
  }

</script>
</body>
</html>
